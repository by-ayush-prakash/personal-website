name: Sync feeds

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch feeds
        id: feeds
        continue-on-error: true
        run: npm run content:fetch -- --strict
      - run: npm run check && npm run build
      - name: Commit feed updates
        run: |
          if git diff --quiet -- src/content && [ -z "$(git ls-files --others --exclude-standard src/content)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content
          git commit -m "Sync RSS content"
          git push
      - name: Report feed failure
        if: steps.feeds.outcome == 'failure'
        run: exit 1
