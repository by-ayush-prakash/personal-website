[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/api/podcast-feed"
  to = "/.netlify/functions/podcast-feed"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
